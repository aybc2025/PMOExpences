<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMO Residences — Expenditure Dashboard</title>
<style>
:root{
  --bg:#0b0e13; --panel:#141922; --panel2:#1b2230; --line:#252d3b; --line2:#323c4e;
  --tx:#e8eef6; --mut:#8d9aad;
  --gold:#d9a94c; --gold2:#f0c979;
  --c1:#d9a94c; --c2:#4cc0b0; --c3:#e0655b; --c4:#8b7ae0; --c5:#4a9ee0;
  --c6:#6fbf5e; --c7:#d970a8; --c8:#e08a3c; --c9:#7d8ca3; --c10:#b4c94a;
  --c11:#55c7d9; --c12:#b08968; --c13:#a67ba6; --c14:#c9a0dc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:"Segoe UI","Assistant","Noto Sans Hebrew","Arial Hebrew",Arial,Helvetica,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(1100px 520px at 12% -8%, #1c2436 0%, transparent 62%),
  radial-gradient(900px 480px at 98% 4%, #1e2030 0%, transparent 58%),
  var(--bg);background-attachment:fixed}
.wrap{max-width:1380px;margin:0 auto;padding:0 22px 80px}

header{padding:34px 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.hrow{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.brand{flex:1;min-width:280px}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
  font-weight:700;margin-bottom:9px}
h1{margin:0;font-size:30px;line-height:1.18;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:14px;margin-top:9px}
.sub b{color:var(--tx);font-weight:650}
.langtog{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;flex-shrink:0}
.langtog button{background:transparent;border:0;color:var(--mut);padding:9px 17px;cursor:pointer;
  font-size:13.5px;font-weight:650;font-family:inherit;transition:.16s}
.langtog button.on{background:var(--gold);color:#1a1408}
.langtog button:not(.on):hover{background:var(--panel2);color:var(--tx)}

.filters{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:15px 17px;margin-bottom:20px}
.frow{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.frow:last-child{margin-bottom:0}
.flab{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);
  font-weight:700;min-width:74px}
.chip{background:var(--panel2);border:1px solid var(--line2);color:var(--mut);border-radius:999px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;font-weight:600}
.chip:hover{color:var(--tx);border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1408}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:7px;
  vertical-align:middle;opacity:.9}
.fstat{margin-inline-start:auto;font-size:12.5px;color:var(--mut)}
.fstat b{color:var(--gold);font-weight:700}
.reset{background:none;border:1px solid var(--line2);color:var(--mut);border-radius:8px;
  padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.reset:hover{color:var(--c3);border-color:var(--c3)}

nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:24px;
  overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  padding:12px 17px;cursor:pointer;font-size:14px;font-weight:650;font-family:inherit;
  white-space:nowrap;transition:.15s;margin-bottom:-1px}
nav.tabs button:hover{color:var(--tx)}
nav.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px;margin-bottom:24px}
.kpi{background:linear-gradient(160deg,var(--panel2) 0%,var(--panel) 100%);
  border:1px solid var(--line);border-radius:13px;padding:16px 17px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--gold)}
.kpi.t2::before{background:var(--c2)}.kpi.t3::before{background:var(--c3)}
.kpi.t4::before{background:var(--c4)}.kpi.t5::before{background:var(--c5)}
.kpi.t6::before{background:var(--c7)}.kpi.t7::before{background:var(--c9)}
.kpi .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);
  font-weight:700;margin-bottom:9px}
.kpi .v{font-size:25px;font-weight:680;letter-spacing:-.02em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.kpi .n{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.35}

.grid{display:grid;gap:18px;margin-bottom:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:19px 20px 21px}
.panel.hero{border-color:#3a3320;background:linear-gradient(150deg,#1e1c14 0%,var(--panel) 70%)}
.ptitle{font-size:15.5px;font-weight:660;margin:0 0 4px;letter-spacing:-.01em}
.pnote{font-size:12.5px;color:var(--mut);margin:0 0 16px;line-height:1.45}
.pnote b{color:var(--tx)}
.legend{display:flex;flex-wrap:wrap;gap:5px 15px;margin-top:15px}
.lg{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut)}
.lg i{width:10px;height:10px;border-radius:2.5px;flex-shrink:0}
.lg b{color:var(--tx);font-weight:620;font-variant-numeric:tabular-nums}

svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--mut);font-size:11px;font-family:inherit}
svg .ax{stroke:var(--line);stroke-width:1}
svg .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
svg .vl{fill:var(--tx);font-size:11px;font-weight:650;font-variant-numeric:tabular-nums}
svg .hit{cursor:pointer}
svg .hit:hover{opacity:.78}
.donutctr{fill:var(--tx);font-size:20px;font-weight:680;font-variant-numeric:tabular-nums}
.donutsub{fill:var(--mut);font-size:11px}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:start;padding:9px 11px;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line2);
  font-weight:700;white-space:nowrap;background:var(--panel)}
.tbl th.srt{cursor:pointer;user-select:none}
.tbl th.srt:hover{color:var(--gold)}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:var(--panel2)}
.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums;font-size:12.5px}
.tw{overflow-x:auto;border-radius:10px}
.negv{color:var(--c2)}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.tag.w{border-color:#6a5426;background:#2b2210;color:var(--gold2)}
.tag.r{border-color:#6b3230;background:#2c1614;color:#f0a49e}
.tag.g{border-color:#2a5a52;background:#11251f;color:#8fe0d2}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:52px;margin-top:5px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}

.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px 18px;
  border-inline-start:3px solid var(--gold)}
.card.a{border-inline-start-color:var(--c3)}
.card.b{border-inline-start-color:var(--c2)}
.card.c{border-inline-start-color:var(--c5)}
.card.d{border-inline-start-color:var(--c4)}
.card .ct{font-size:14px;font-weight:660;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.card .cb{font-size:13px;color:var(--mut);line-height:1.62}
.card .cb b{color:var(--tx);font-weight:650}
.card .cb .big{display:block;font-size:23px;color:var(--gold);font-weight:680;margin:7px 0 5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;
  background:var(--panel2);flex-shrink:0}

.searchrow{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
input[type=search],select{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);
  border-radius:9px;padding:9px 13px;font-size:13.5px;font-family:inherit;outline:none}
input[type=search]{flex:1;min-width:210px}
input[type=search]:focus,select:focus{border-color:var(--gold)}
.pg{display:flex;gap:7px;align-items:center;justify-content:center;margin-top:16px;
  font-size:13px;color:var(--mut)}
.pg button{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;
  padding:6px 13px;cursor:pointer;font-family:inherit;font-size:13px}
.pg button:disabled{opacity:.35;cursor:default}
.pg button:not(:disabled):hover{border-color:var(--gold)}

.tip{position:fixed;pointer-events:none;background:#050709;border:1px solid var(--line2);
  border-radius:9px;padding:9px 12px;font-size:12.5px;color:var(--tx);z-index:99;opacity:0;
  transition:opacity .1s;max-width:290px;box-shadow:0 10px 30px rgba(0,0,0,.6);line-height:1.5}
.tip.on{opacity:1}
.tip .th{font-weight:680;margin-bottom:3px}
.tip .tv{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:660}
.tip .ts{color:var(--mut);font-size:11.5px}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);
  font-size:12px;color:var(--mut);line-height:1.7}
.hide{display:none !important}
[dir=rtl] .kpi .v,[dir=rtl] .num,[dir=rtl] .mono{direction:ltr;unicode-bidi:embed}
h2.sect{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  font-weight:700;margin:30px 0 14px}
h2.sect:first-child{margin-top:0}
.ok{color:#6fbf5e;font-weight:680}
@media(max-width:620px){h1{font-size:23px}.wrap{padding:0 14px 60px}.kpi .v{font-size:21px}}
</style>
</head>
<body>
<div class="tip" id="tip"></div>
<div class="wrap">
<header>
  <div class="hrow">
    <div class="brand">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <div class="sub" id="hsub"></div>
    </div>
    <div class="langtog">
      <button id="btnEn" class="on" onclick="setLang('en')">English</button>
      <button id="btnHe" onclick="setLang('he')">עברית</button>
    </div>
  </div>
</header>

<div class="filters">
  <div class="frow"><span class="flab" id="lfSite"></span><span id="siteChips"></span></div>
  <div class="frow"><span class="flab" id="lfSrc"></span><span id="srcChips"></span></div>
  <div class="frow"><span class="flab" id="lfFy"></span><span id="fyChips"></span>
    <span class="flab" style="margin-inline-start:18px" id="lfCat"></span><span id="catSel"></span>
    <button class="reset" id="btnReset" onclick="resetF()"></button>
    <span class="fstat" id="fstat"></span>
  </div>
</div>

<nav class="tabs" id="tabs"></nav>
<div id="tab-over"></div>
<div id="tab-site" class="hide"></div>
<div id="tab-trend" class="hide"></div>
<div id="tab-vend" class="hide"></div>
<div id="tab-ins" class="hide"></div>
<div id="tab-data" class="hide"></div>
<div id="tab-src" class="hide"></div>
<footer id="foot"></footer>
</div>

 foot:['Source: three distinct expenditure extracts from the Prime Minister’s Office covering FY2023–FY2026 — 2,188 itemized payment lines totalling ₪931,153.47, plus ₪1,736,037.58 of payroll disclosed only as annual totals. Grand total ₪2,667,191.05, which equals the sum of the three files’ own declared totals. Figures are executed payments (ביצוע בפועל), net of credits. A fourth supplied file is a byte-identical duplicate and is excluded. Where the extracts used different labels for the same thing (מים / הוצאות מים, גינון / שירותי גינון, ביטוח / הוצאות ביטוח, and others) the categories were merged; the original cost-centre label is preserved on every row. This dashboard describes what the records say; it does not assert that any expense was improper.',
       'מקור: שלושה קבצי הוצאות נפרדים ממשרד ראש הממשלה לשנים 2023–2026 — 2,188 שורות תשלום מפורטות בסך ₪931,153.47, בתוספת ₪1,736,037.58 הוצאות שכר שנחשפו כסכומים שנתיים בלבד. סך הכול ₪2,667,191.05, השווה לסכום הסכומים המוצהרים בשלושת הקבצים. הנתונים הם תשלומים בביצוע בפועל, בנטו לאחר זיכויים. קובץ רביעי שסופק הוא כפילות זהה ברמת הבייט והוצא. במקום שהקבצים השתמשו בתוויות שונות לאותו דבר (מים / הוצאות מים, גינון / שירותי גינון, ביטוח / הוצאות ביטוח ואחרים) אוחדו הסיווגים; תווית מרכז העלות המקורית נשמרת בכל שורה. לוח זה מתאר מה שכתוב ברשומות, ואינו קובע שהוצאה כלשהי הייתה בלתי תקינה.']
};
const t=k=>T[k][L==='en'?0:1];
const catN=c=>CATS[c][L==='en'?1:2];
const siteN=s=>SITES[s][L==='en'?1:2];
const srcN=s=>SRCS[s][L==='en'?1:2];
const ccN=c=>CCS[c][L==='en'?1:0];
const venN=v=>VENS[v][L==='en'?1:0];

const nf=new Intl.NumberFormat('en-US');
const money=n=>(n<0?'−':'')+'₪'+nf.format(Math.round(Math.abs(n)));
const money2=n=>(n<0?'−':'')+'₪'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'0%';
const kf=n=>Math.abs(n)>=1000?(n/1000).toFixed(n%1000===0?0:1)+'k':String(Math.round(n));
const MON=[['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
           ['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ']];
const mLab=m=>{const[y,mm]=m.split('-');return MON[L==='en'?0:1][+mm-1]+' '+y.slice(2);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let F={site:new Set(),src:new Set(),fy:new Set(),cat:'all'};
const view=()=>D.filter(r=>(!F.site.size||F.site.has(r.s))&&(!F.src.size||F.src.has(r.src))
  &&(!F.fy.size||F.fy.has(r.fy))&&(F.cat==='all'||r.c===+F.cat));
const sum=a=>a.reduce((s,r)=>s+r.a,0);
function grp(rows,key){const m={};rows.forEach(r=>{const k=key(r);if(k===null||k===undefined)return;
  (m[k]=m[k]||{k:k,s:0,n:0,vals:[]});m[k].s+=r.a;m[k].n++;m[k].vals.push(r.a);});return Object.values(m);}
const med=v=>{if(!v.length)return 0;const s=[...v].sort((a,b)=>a-b),h=s.length>>1;
  return s.length%2?s[h]:(s[h-1]+s[h])/2;};

const tip=document.getElementById('tip');
function tShow(e,html){tip.innerHTML=html;tip.classList.add('on');tMove(e);}
function tMove(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-h-12;
  if(x+w>innerWidth-10)x=e.clientX-w-14;if(y<8)y=e.clientY+18;
  tip.style.left=x+'px';tip.style.top=y+'px';}
function tHide(){tip.classList.remove('on');}
document.addEventListener('scroll',tHide,true);

const S=(tag,at,kids)=>{let s='<'+tag;for(const k in at)if(at[k]!==null&&at[k]!==undefined)s+=' '+k+'="'+at[k]+'"';
  return kids!==undefined?s+'>'+kids+'</'+tag+'>':s+'/>';};
const polar=(cx,cy,r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
function annulus(cx,cy,r1,r2,a0,a1){
  if(a1-a0>=Math.PI*2-1e-6)
    return`M${cx-r2} ${cy}A${r2} ${r2} 0 1 1 ${cx+r2} ${cy}A${r2} ${r2} 0 1 1 ${cx-r2} ${cy}Z`+
          `M${cx-r1} ${cy}A${r1} ${r1} 0 1 0 ${cx+r1} ${cy}A${r1} ${r1} 0 1 0 ${cx-r1} ${cy}Z`;
  const[x0,y0]=polar(cx,cy,r2,a0),[x1,y1]=polar(cx,cy,r2,a1),
        [x2,y2]=polar(cx,cy,r1,a1),[x3,y3]=polar(cx,cy,r1,a0),lg=(a1-a0)>Math.PI?1:0;
  return`M${x0} ${y0}A${r2} ${r2} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r1} ${r1} 0 ${lg} 0 ${x3} ${y3}Z`;}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));
  const r=v/p;return (r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*p;}

function donut(items,total,cl,cs){
  const W=340,H=280,cx=W/2,cy=H/2,r2=118,r1=70;let a=-Math.PI/2,body='';
  items.forEach(it=>{const fr=Math.abs(it.v)/total,sw=fr*Math.PI*2;if(sw<=0)return;
    body+=S('path',{d:annulus(cx,cy,r1,r2,a,a+sw),fill:it.c,stroke:'var(--panel)','stroke-width':2,class:'hit',
      'data-t':esc(`<div class="th">${esc(it.l)}</div><div class="tv">${money2(it.v)}</div><div class="ts">${pct(Math.abs(it.v),total)} · ${it.n} ${L==='en'?'lines':'שורות'}</div>`),
      'data-k':it.k===undefined?'':it.k});a+=sw;});
  body+=S('text',{x:cx,y:cy-2,'text-anchor':'middle',class:'donutctr'},esc(cl));
  body+=S('text',{x:cx,y:cy+18,'text-anchor':'middle',class:'donutsub'},esc(cs));
  return S('svg',{viewBox:`0 0 ${W} ${H}`,style:'max-width:360px;margin:0 auto'},body);}

function hbars(items,opt){
  opt=opt||{};const n=items.length,rh=opt.rh||42,W=560,plot=W-104,H=n*rh+8;
  const fmt=opt.fmt||money,fmt2=opt.fmt||money2,ax=opt.fmt?(x=>nf.format(Math.round(x))):(x=>'₪'+kf(x));
  const mx=niceMax(Math.max(...items.map(i=>Math.abs(i.v)),1));let body='';
  for(let g=1;g<=4;g++){const x=plot*g/4;
    body+=S('line',{x1:x,x2:x,y1:0,y2:n*rh,class:'gl'});
    body+=S('text',{x:x,y:n*rh+15,'text-anchor':'middle'},ax(mx*g/4));}
  items.forEach((it,i)=>{
    const yl=i*rh+13,yb=i*rh+19,bh=Math.min(13,rh-24),bw=Math.max(2,plot*Math.abs(it.v)/mx);
    const tp=esc(`<div class="th">${esc(it.l)}</div><div class="tv">${fmt2(it.v)}</div><div class="ts">${it.n} ${L==='en'?'lines':'שורות'}${opt.tot?' · '+pct(Math.abs(it.v),opt.tot):''}</div>`);
    body+=S('rect',{x:0,y:i*rh,width:W,height:rh,fill:'transparent','data-t':tp});
    body+=S('text',{x:0,y:yl,style:'font-size:12.5px;fill:var(--tx);font-weight:600'},
      esc(it.l.length>48?it.l.slice(0,47)+'…':it.l));
    body+=S('rect',{x:0,y:yb,width:bw,height:bh,rx:3,fill:it.c,class:'hit','data-t':tp,
      'data-k':it.k===undefined?'':it.k});
    body+=S('text',{x:bw+8,y:yb+bh-2,class:'vl'},fmt(it.v));});
  return S('svg',{viewBox:`0 0 ${W} ${H+20}`},body);}

function dualbars(rows,la,lb,ca,cb){
  const rh=54,W=560,plot=W-104,H=rows.length*rh+8;
  const mx=niceMax(Math.max(...rows.flatMap(r=>[r.a,r.b]),1));let body='';
  for(let g=1;g<=4;g++){const x=plot*g/4;
    body+=S('line',{x1:x,x2:x,y1:0,y2:rows.length*rh,class:'gl'});
    body+=S('text',{x:x,y:rows.length*rh+15,'text-anchor':'middle'},'₪'+kf(mx*g/4));}
  rows.forEach((r,i)=>{
    body+=S('text',{x:0,y:i*rh+12,style:'font-size:12.5px;fill:var(--tx);font-weight:600'},esc(r.l));
    [[r.a,ca,la,i*rh+18],[r.b,cb,lb,i*rh+33]].forEach(([v,c,lab,y])=>{
      const bw=Math.max(2,plot*v/mx);
      body+=S('rect',{x:0,y:y,width:bw,height:11,rx:2.5,fill:c,class:'hit',
        'data-t':esc(`<div class="th">${esc(r.l)}</div><div class="ts">${esc(lab)}</div><div class="tv">${money2(v)}</div>`)});
      body+=S('text',{x:bw+7,y:y+9.5,class:'vl',style:'font-size:10.5px'},money2(v));});});
  return S('svg',{viewBox:`0 0 ${W} ${H+20}`},body);}

function stack100(rows,W2){
  const rh=52,W=W2||620,H=rows.length*rh+26;let body='';
  rows.forEach((r,i)=>{const y=i*rh+18;let x=0;
    body+=S('text',{x:0,y:y-5,style:'font-size:12.5px;fill:var(--tx);font-weight:600'},esc(r.l));
    body+=S('text',{x:W,y:y-5,'text-anchor':'end',class:'vl'},money(r.tot));
    r.parts.forEach(p=>{const w=W*p.v/r.tot;if(w<=0)return;
      body+=S('rect',{x:x,y:y,width:Math.max(w,.5),height:22,fill:p.c,class:'hit',
        'data-t':esc(`<div class="th">${esc(p.l)}</div><div class="tv">${money2(p.v)}</div><div class="ts">${pct(p.v,r.tot)} ${L==='en'?'of':'מ'} ${esc(r.l)} · ${p.n} ${L==='en'?'lines':'שורות'}</div>`),
        'data-k':p.k===undefined?'':p.k});x+=w;});});
  return S('svg',{viewBox:`0 0 ${W} ${H}`},body);}

function vbars(items,opt){
  opt=opt||{};const W=680,H=opt.h||260,bt=26,bb=42,bl=52,br=8;
  const pw=(W-bl-br)/items.length,mx=niceMax(Math.max(...items.map(i=>i.v),1));
  const sy=v=>H-bb-(H-bt-bb)*v/mx;let body='';
  for(let g=0;g<=4;g++){const y=sy(mx*g/4);
    body+=S('line',{x1:bl,x2:W-br,y1:y,y2:y,class:'gl'});
    body+=S('text',{x:bl-9,y:y+4,'text-anchor':'end'},'₪'+kf(mx*g/4));}
  items.forEach((it,i)=>{const bw=Math.max(3,pw*.66),x=bl+i*pw+(pw-bw)/2,y=sy(it.v);
    body+=S('rect',{x:x,y:y,width:bw,height:Math.max(1,H-bb-y),rx:2.5,fill:it.c||cssv('--gold'),class:'hit',
      'data-t':esc(`<div class="th">${esc(it.l)}</div><div class="tv">${money2(it.v)}</div><div class="ts">${it.n} ${L==='en'?'lines':'שורות'}</div>`)});
    if(items.length<=26||i%2===0)
      body+=S('text',{x:bl+i*pw+pw/2,y:H-bb+17,'text-anchor':'middle',
        transform:items.length>14?`rotate(-42 ${bl+i*pw+pw/2} ${H-bb+17})`:null},esc(it.l));});
  body+=S('line',{x1:bl,x2:W-br,y1:H-bb,y2:H-bb,class:'ax'});
  return S('svg',{viewBox:`0 0 ${W} ${H}`},body);}

function area(items,color){
  const W=680,H=250,bt=20,bb=40,bl=54,br=10;
  const mx=niceMax(Math.max(...items.map(i=>i.v),1));
  const sx=i=>bl+(W-bl-br)*(items.length<2?.5:i/(items.length-1));
  const sy=v=>H-bb-(H-bt-bb)*v/mx;let body='',ln='',ar='';
  for(let g=0;g<=4;g++){const y=sy(mx*g/4);
    body+=S('line',{x1:bl,x2:W-br,y1:y,y2:y,class:'gl'});
    body+=S('text',{x:bl-9,y:y+4,'text-anchor':'end'},'₪'+kf(mx*g/4));}
  items.forEach((it,i)=>{const x=sx(i),y=sy(it.v);ln+=(i?'L':'M')+x+' '+y;ar+=(i?'L':'M')+x+' '+y;});
  ar+=`L${sx(items.length-1)} ${H-bb}L${sx(0)} ${H-bb}Z`;
  body+=S('path',{d:ar,fill:color,opacity:.16});
  body+=S('path',{d:ln,fill:'none',stroke:color,'stroke-width':2.2,'stroke-linejoin':'round'});
  items.forEach((it,i)=>{const x=sx(i),y=sy(it.v);
    body+=S('circle',{cx:x,cy:y,r:3.4,fill:cssv('--panel'),stroke:color,'stroke-width':2});
    body+=S('circle',{cx:x,cy:y,r:11,fill:'transparent',class:'hit',
      'data-t':esc(`<div class="th">${esc(it.l)}</div><div class="tv">${money2(it.v)}</div><div class="ts">${it.n} ${L==='en'?'lines':'שורות'}</div>`)});
    if(i%Math.ceil(items.length/12)===0||items.length<=14)
      body+=S('text',{x:x,y:H-bb+17,'text-anchor':'middle',transform:`rotate(-42 ${x} ${H-bb+17})`},esc(it.l));});
  body+=S('line',{x1:bl,x2:W-br,y1:H-bb,y2:H-bb,class:'ax'});
  return S('svg',{viewBox:`0 0 ${W} ${H}`},body);}

function wire(root){
  root.querySelectorAll('[data-t]').forEach(el=>{
    el.addEventListener('mouseenter',e=>tShow(e,el.getAttribute('data-t')));
    el.addEventListener('mousemove',tMove);el.addEventListener('mouseleave',tHide);});
  root.querySelectorAll('svg [data-k]').forEach(el=>{
    const k=el.getAttribute('data-k');if(k==='')return;el.style.cursor='pointer';
    el.addEventListener('click',()=>{const sel=document.getElementById('catsel');
      if(sel&&CATS[+k]){F.cat=String(+k);sel.value=F.cat;renderAll();window.scrollTo({top:0,behavior:'smooth'});}});});
}
</script>

<script>
function renderControls(){
  document.getElementById('eyebrow').textContent=t('eyebrow');
  document.getElementById('h1').textContent=t('h1');
  document.getElementById('hsub').innerHTML = L==='en'
    ? `Three source extracts · grand total <b>${money(GRAND)}</b> = <b>${money(ITEM)}</b> itemized across <b>${nf.format(D.length)}</b> payment lines + <b>${money(PAY)}</b> payroll · FY2023–FY2026`
    : `שלושה קבצי מקור · סך הכול <b>${money(GRAND)}</b> = <b>${money(ITEM)}</b> מפורט ב־<b>${nf.format(D.length)}</b> שורות תשלום + <b>${money(PAY)}</b> שכר · 2023–2026`;
  ['lfSite','lfSrc','lfFy','lfCat'].forEach(k=>document.getElementById(k).textContent=t(k));
  document.getElementById('btnReset').textContent=t('reset');
  document.getElementById('siteChips').innerHTML=siteOrder.map(s=>
    `<button class="chip ${F.site.has(s)?'on':''}" onclick="tgl('site',${s})"><span class="dot" style="background:${SITECOL[s]}"></span>${esc(siteN(s))}</button>`).join(' ');
  document.getElementById('srcChips').innerHTML=SRCS.map((x,i)=>
    `<button class="chip ${F.src.has(i)?'on':''}" onclick="tgl('src',${i})">${esc(srcN(i))}</button>`).join(' ');
  const fys=[...new Set(D.map(r=>r.fy))].filter(x=>x).sort();
  document.getElementById('fyChips').innerHTML=fys.map(y=>
    `<button class="chip ${F.fy.has(y)?'on':''}" onclick="tgl('fy',${y})">${y}</button>`).join(' ');
  document.getElementById('catSel').innerHTML=
    `<select id="catsel" onchange="F.cat=this.value;renderAll()"><option value="all">${t('all')}</option>`+
    catOrder.map(c=>`<option value="${c}" ${F.cat===String(c)?'selected':''}>${esc(catN(c))}</option>`).join('')+`</select>`;
  const v=view();
  document.getElementById('fstat').innerHTML=
    t('fstat').replace('%s',`<b>${nf.format(v.length)}</b>`).replace('%s',nf.format(D.length))
      .replace('%v',`<b>${money(sum(v))}</b>`);
  document.getElementById('tabs').innerHTML=t('tabs').map((n,i)=>
    `<button class="${i===TAB?'on':''}" onclick="setTab(${i})">${esc(n)}</button>`).join('');
  document.getElementById('foot').textContent=t('foot');
}
function tgl(kind,val){const s=F[kind];s.has(val)?s.delete(val):s.add(val);renderAll();}
function resetF(){F={site:new Set(),src:new Set(),fy:new Set(),cat:'all'};renderAll();}
let TAB=0;
const TABIDS=['tab-over','tab-site','tab-trend','tab-vend','tab-ins','tab-data','tab-src'];
function setTab(i){TAB=i;renderAll();window.scrollTo({top:0,behavior:'smooth'});}
function setLang(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l==='he'?'rtl':'ltr';
  document.getElementById('btnEn').className=l==='en'?'on':'';
  document.getElementById('btnHe').className=l==='he'?'on':'';renderAll();}
const kpi=(cls,k,val,note)=>`<div class="kpi ${cls}"><div class="k">${esc(k)}</div><div class="v">${val}</div><div class="n">${note}</div></div>`;
const card=(cls,ic,title,body)=>`<div class="card ${cls}"><div class="ct"><span class="ic">${ic}</span>${esc(title)}</div><div class="cb">${body}</div></div>`;
const CAES=()=>siteOrder.filter(s=>SITES[s][3]==='private'||SITES[s][0]==='it');

/* ============ OVERVIEW ============ */
function tabOverview(){
  const v=view(),tot=sum(v);
  const caes=v.filter(r=>SITES[r.s][3]==='private'||SITES[r.s][0]==='it');
  const und=v.filter(r=>VENS[r.v][1].indexOf('State Security')===0);
  const net=v.filter(r=>VENS[r.v][1].indexOf('Netanyahu')===0);
  const big=v.length?v.reduce((a,b)=>b.a>a.a?b:a):{a:0,d:'—'};
  let h='';
  /* budget architecture hero */
  const arch=[{l:t('itemized'),v:ITEM,n:D.length,c:cssv('--gold')}]
    .concat(PAYROLL.map((p,i)=>({l:L==='en'?p.le:p.lh,v:p.amt,n:1,c:i?cssv('--c9'):cssv('--c4')})));
  h+=`<div class="panel hero" style="margin-bottom:24px">
    <h3 class="ptitle">${t('pArch')}</h3>
    <p class="pnote">${t('pArchN').replace('%g',money(GRAND)).replace('%i',money(ITEM))
      .replace('%pi',pct(ITEM,GRAND)).replace('%n',nf.format(D.length)).replace('%p',money(PAY))}</p>
    ${stack100([{l:t('hTotal')+' · '+money(GRAND),tot:GRAND,parts:arch}],660)}
    <div class="legend">${arch.map(a=>
      `<span class="lg"><i style="background:${a.c}"></i>${esc(a.l)} <b>${money(a.v)}</b> · ${pct(a.v,GRAND)}</span>`).join('')}</div></div>`;
  /* kpis */
  h+=`<div class="kpis">
   ${kpi('',t('kGrand'),money(GRAND),t('kGrandN'))}
   ${kpi('t2',t('kItem'),money(ITEM),t('kItemN').replace('%p',pct(ITEM,GRAND)).replace('%n',nf.format(D.length)))}
   ${kpi('t7',t('kPay'),money(PAY),t('kPayN').replace('%p',pct(PAY,GRAND)))}
   ${kpi('t4',t('kCaes'),money(sum(caes)),t('kCaesN').replace('%p',pct(sum(caes),tot)))}
   ${kpi('t5',t('kUndis'),money(sum(und)),t('kUndisN').replace('%n',nf.format(und.length)))}
   ${kpi('t6',t('kNet'),money(sum(net)),t('kNetN').replace('%n',net.length))}
   ${kpi('t3',t('kBig'),money(big.a),esc(big.d||'—'))}
  </div>`;
  /* donut + sites */
  const cg=grp(v,r=>r.c).sort((a,b)=>b.s-a.s);
  const items=cg.map(g=>({l:catN(+g.k),v:g.s,n:g.n,c:CATCOL[+g.k],k:+g.k}));
  const sg=grp(v,r=>r.s).sort((a,b)=>b.s-a.s);
  h+=`<div class="grid g2">
    <div class="panel"><h3 class="ptitle">${t('pCat')}</h3><p class="pnote">${t('pCatN')}</p>
      ${items.length?donut(items,items.reduce((s,i)=>s+Math.abs(i.v),0),money(tot),t('itemized')):`<p class="pnote">${t('none')}</p>`}
      <div class="legend">${items.map(i=>
        `<span class="lg"><i style="background:${i.c}"></i>${esc(i.l)} <b>${pct(Math.abs(i.v),tot)}</b></span>`).join('')}</div></div>
    <div class="panel"><h3 class="ptitle">${t('pSite')}</h3><p class="pnote">${t('pSiteN')}</p>
      ${sg.length?hbars(sg.map(g=>({l:siteN(+g.k),v:g.s,n:g.n,c:SITECOL[+g.k]})),{rh:44,tot:tot}):`<p class="pnote">${t('none')}</p>`}</div></div>`;
  /* mix */
  const rows=sg.map(g=>{const rr=v.filter(r=>r.s===+g.k&&r.a>0);
    const parts=grp(rr,r=>r.c).sort((a,b)=>b.s-a.s).map(p=>({l:catN(+p.k),v:p.s,n:p.n,c:CATCOL[+p.k],k:+p.k}));
    return{l:siteN(+g.k),tot:parts.reduce((s,p)=>s+p.v,0),parts:parts};}).filter(r=>r.tot>0);
  h+=`<div class="panel" style="margin-bottom:18px"><h3 class="ptitle">${t('pMix')}</h3>
    <p class="pnote">${t('pMixN')}</p>${rows.length?stack100(rows):`<p class="pnote">${t('none')}</p>`}</div>`;
  /* monthly */
  const dated=v.filter(r=>r.m),ud=v.filter(r=>!r.m);
  const mg=grp(dated,r=>r.m).sort((a,b)=>a.k<b.k?-1:1);
  h+=`<div class="panel"><h3 class="ptitle">${t('pMon')}</h3>
    <p class="pnote">${t('pMonN').replace('%n',nf.format(ud.length)).replace('%v',money(sum(ud)))}</p>
    ${mg.length?area(mg.map(g=>({l:mLab(g.k),v:g.s,n:g.n})),cssv('--gold')):`<p class="pnote">${t('none')}</p>`}</div>`;
  return h;
}

/* ============ SITES ============ */
function tabSite(){
  const v=view(),tot=sum(v);
  const g=grp(v,r=>r.s).sort((a,b)=>b.s-a.s);
  if(!g.length)return `<div class="panel"><p class="pnote">${t('none')}</p></div>`;
  let h=`<div class="panel" style="margin-bottom:18px"><h3 class="ptitle">${t('pSiteT')}</h3>
    <p class="pnote">${t('pSiteTN')}</p><div class="tw"><table class="tbl"><thead><tr>
    <th>${t('hSite')}</th><th>${t('hCC')}</th><th class="num">${t('hAmt')}</th><th class="num">${t('hShare')}</th>
    <th class="num">${t('hCnt')}</th><th class="num">${t('hAvg')}</th><th class="num">${t('hMed')}</th>
    <th class="num">${t('hMax')}</th><th>${L==='en'?'Top category':'סיווג מוביל'}</th></tr></thead><tbody>`;
  g.forEach(x=>{const rr=v.filter(r=>r.s===+x.k);
    const top=grp(rr,r=>r.c).sort((a,b)=>b.s-a.s)[0];
    const ccs=[...new Set(rr.map(r=>r.cc))];
    h+=`<tr><td><b>${esc(siteN(+x.k))}</b>${SITES[+x.k][3]==='private'?` <span class="tag w">${L==='en'?'private':'פרטי'}</span>`:''}
      <div class="bar"><i style="width:${(x.s/g[0].s*100).toFixed(1)}%;background:${SITECOL[+x.k]}"></i></div></td>
      <td style="font-size:11.5px;color:var(--mut)">${ccs.map(c=>esc(ccN(c))).join('<br>')}</td>
      <td class="num mono">${money2(x.s)}</td><td class="num mono">${pct(x.s,tot)}</td>
      <td class="num mono">${nf.format(x.n)}</td><td class="num mono">${money2(x.s/x.n)}</td>
      <td class="num mono">${money2(med(x.vals))}</td><td class="num mono">${money2(Math.max(...x.vals))}</td>
      <td>${top?esc(catN(+top.k))+' <span class="tag">'+pct(top.s,x.s)+'</span>':'—'}</td></tr>`;});
  h+=`</tbody></table></div></div>`;
  const prof=g.map(x=>({l:siteN(+x.k),a:x.s/x.n,b:med(x.vals)}));
  h+=`<div class="grid g2" style="margin-bottom:18px">
    <div class="panel"><h3 class="ptitle">${t('pSize')}</h3><p class="pnote">${t('pSizeN')}</p>
      ${dualbars(prof,t('hAvg'),t('hMed'),cssv('--gold'),cssv('--c5'))}
      <div class="legend"><span class="lg"><i style="background:${cssv('--gold')}"></i>${t('hAvg')}</span>
      <span class="lg"><i style="background:${cssv('--c5')}"></i>${t('hMed')}</span></div></div>
    <div class="panel"><h3 class="ptitle">${t('pVol')}</h3><p class="pnote">${t('pVolN')}</p>
      ${hbars(g.map(x=>({l:siteN(+x.k),v:x.n,n:x.n,c:SITECOL[+x.k]})).sort((a,b)=>b.v-a.v),
        {rh:40,fmt:x=>nf.format(Math.round(x))+(L==='en'?' lines':' שורות')})}</div></div>`;
  /* matrix */
  const cs=catOrder.filter(c=>v.some(r=>r.c===c));
  const mx=Math.max(...cs.flatMap(c=>g.map(x=>Math.abs(sum(v.filter(r=>r.c===c&&r.s===+x.k))))),1);
  h+=`<div class="panel"><h3 class="ptitle">${t('pHeat')}</h3><p class="pnote">${t('pHeatN')}</p>
    <div class="tw"><table class="tbl"><thead><tr><th>${t('hCat')}</th>`+
    g.map(x=>`<th class="num">${esc(siteN(+x.k))}</th>`).join('')+`<th class="num">${t('hTotal')}</th></tr></thead><tbody>`;
  cs.forEach(c=>{h+=`<tr><td><span class="lg"><i style="background:${CATCOL[c]}"></i>${esc(catN(c))}</span></td>`;
    g.forEach(x=>{const rr=v.filter(r=>r.c===c&&r.s===+x.k),s=sum(rr);
      const op=s>0?(0.10+0.80*Math.sqrt(s/mx)):0;
      h+=`<td class="num mono" style="background:${s>0?hexA(CATCOL[c],op):'transparent'};color:${op>.5?'#fff':'inherit'}"
        ${rr.length?`data-t="${esc(`<div class="th">${esc(siteN(+x.k))}</div><div class="ts">${esc(catN(c))}</div><div class="tv">${money2(s)}</div><div class="ts">${rr.length} ${L==='en'?'lines':'שורות'}</div>`)}"`:''}
        >${rr.length?money(s):'<span style="color:var(--line2)">·</span>'}</td>`;});
    h+=`<td class="num mono"><b>${money(sum(v.filter(r=>r.c===c)))}</b></td></tr>`;});
  h+=`<tr style="border-top:2px solid var(--line2)"><td><b>${t('hTotal')}</b></td>`+
    g.map(x=>`<td class="num mono"><b>${money(x.s)}</b></td>`).join('')+
    `<td class="num mono"><b>${money(tot)}</b></td></tr></tbody></table></div></div>`;
  return h;
}
function hexA(hex,a){hex=hex.replace('#','');
  return`rgba(${parseInt(hex.slice(0,2),16)},${parseInt(hex.slice(2,4),16)},${parseInt(hex.slice(4,6),16)},${a.toFixed(3)})`;}

/* ============ TRENDS ============ */
function tabTrend(){
  const v=view(),dated=v.filter(r=>r.m);
  const mg=grp(dated,r=>r.m).sort((a,b)=>a.k<b.k?-1:1);
  const fg=grp(v,r=>r.fy).sort((a,b)=>a.k-b.k);
  let cum=0;const ci=mg.map(g=>{cum+=g.s;return{l:mLab(g.k),v:cum,n:g.n};});
  const qg=grp(dated,r=>{const[y,m]=r.m.split('-');return y+' Q'+(Math.floor((+m-1)/3)+1);}).sort((a,b)=>a.k<b.k?-1:1);
  const none=`<p class="pnote">${t('none')}</p>`;
  return `<div class="grid g2">
    <div class="panel"><h3 class="ptitle">${t('pFy')}</h3><p class="pnote">${t('pFyN')}</p>
      ${fg.length?vbars(fg.map(g=>({l:String(g.k),v:g.s,n:g.n,c:cssv('--gold')})),{h:250}):none}
      <div class="legend">${fg.map(g=>`<span class="lg"><i style="background:${cssv('--gold')}"></i>FY${g.k} <b>${money(g.s)}</b> · ${nf.format(g.n)}</span>`).join('')}</div></div>
    <div class="panel"><h3 class="ptitle">${t('pQ')}</h3><p class="pnote">${t('pQN')}</p>
      ${qg.length?vbars(qg.map(g=>({l:g.k,v:g.s,n:g.n,c:cssv('--c2')})),{h:250}):none}</div></div>
  <div class="panel" style="margin-bottom:18px"><h3 class="ptitle">${t('pMon')}</h3>
    <p class="pnote">${t('pMonN').replace('%n',nf.format(v.filter(r=>!r.m).length)).replace('%v',money(sum(v.filter(r=>!r.m))))}</p>
    ${mg.length?vbars(mg.map(g=>({l:mLab(g.k),v:g.s,n:g.n,c:cssv('--gold')})),{h:290}):none}</div>
  <div class="panel"><h3 class="ptitle">${t('pCum')}</h3><p class="pnote">${t('pCumN')}</p>
    ${ci.length?area(ci,cssv('--c4')):none}</div>`;
}

/* ============ VENDORS ============ */
function tabVend(){
  const v=view(),tot=sum(v);
  const g=grp(v,r=>r.v).sort((a,b)=>b.s-a.s);
  const NON=['State Security — Clause 9(a)(1) [undisclosed]','Unallocated','(blank)'];
  const isNon=i=>NON.indexOf(VENS[i][1])>=0;
  const nm=v.filter(r=>!isNon(r.v)),un=v.filter(r=>isNon(r.v));
  if(!g.length)return `<div class="panel"><p class="pnote">${t('none')}</p></div>`;
  let h=`<div class="grid g2">
    <div class="panel"><h3 class="ptitle">${t('pDisc')}</h3><p class="pnote">${t('pDiscN')}</p>
      ${donut([{l:t('unnamed'),v:sum(un),n:un.length,c:cssv('--c3')},{l:t('named'),v:sum(nm),n:nm.length,c:cssv('--c2')}],
        Math.abs(sum(un))+Math.abs(sum(nm)),pct(sum(un),tot),t('unnamed'))}
      <div class="legend">
        <span class="lg"><i style="background:${cssv('--c3')}"></i>${t('unnamed')} <b>${money(sum(un))}</b> · ${nf.format(un.length)}</span>
        <span class="lg"><i style="background:${cssv('--c2')}"></i>${t('named')} <b>${money(sum(nm))}</b> · ${nf.format(nm.length)}</span></div></div>
    <div class="panel"><h3 class="ptitle">${t('pVen')}</h3><p class="pnote">${t('pVenN')}</p>
      ${hbars(g.slice(0,10).map(x=>({l:venN(+x.k),v:x.s,n:x.n,c:isNon(+x.k)?cssv('--c3'):cssv('--c5')})),{rh:36,tot:tot})}</div></div>
  <div class="panel"><h3 class="ptitle">${t('pVen')}</h3><p class="pnote">${t('pDataN')}</p><div class="tw"><table class="tbl">
   <thead><tr><th>${t('hVen')}</th><th class="num">${t('hAmt')}</th><th class="num">${t('hShare')}</th>
   <th class="num">${t('hCnt')}</th><th class="num">${t('hAvg')}</th><th>${t('hSite')}</th><th>${t('hCat')}</th></tr></thead><tbody>`;
  g.forEach(x=>{const rr=v.filter(r=>r.v===+x.k);
    h+=`<tr><td><b>${esc(venN(+x.k))}</b>${isNon(+x.k)?` <span class="tag r">${L==='en'?'not a vendor':'לא ספק'}</span>`:''}</td>
      <td class="num mono">${money2(x.s)}</td><td class="num mono">${pct(x.s,tot)}</td>
      <td class="num mono">${nf.format(x.n)}</td><td class="num mono">${money2(x.s/x.n)}</td>
      <td style="font-size:11.5px">${[...new Set(rr.map(r=>r.s))].map(s=>esc(siteN(s))).join('<br>')}</td>
      <td style="font-size:11.5px">${grp(rr,r=>r.c).sort((a,b)=>b.s-a.s).slice(0,3).map(c=>esc(catN(+c.k))).join('<br>')}</td></tr>`;});
  return h+`</tbody></table></div></div>`;
}

     :`תשלומים שנרשמו תחת <b>ביטחון מדינה, סעיף 9(א)(1)</b> — סעיף חיסיון שמונע חשיפת זהות הספק — מסתכמים ב<span class="big">${money(sum(und))}</span>

  if(cr.length) h+=card('b','↩',E?'Money that came back':'כסף שחזר',

      to the ledger — refunds, cancelled charges and explicit double-posting corrections (one is labelled "cancellation of duplicate Home Center entry", another "credit for a leak"). Their presence is a good sign: someone is checking. Gross outlay before corrections was <b>${money(tot+Math.abs(sum(cr)))}</b>.`
     :`<b>${cr.length}</b> שורות שליליות מחזירות <span class="big">${money(Math.abs(sum(cr)))}</span>
      לספרים — החזרים, חיובים שבוטלו ותיקוני רישום כפול מוצהרים (אחד מסומן "ביטול רישום כפול הום סנטר", אחר "זיכוי בגין נזילה"). נוכחותם סימן טוב: מישהו בודק. ההוצאה הגולמית לפני תיקונים הייתה <b>${money(tot+Math.abs(sum(cr)))}</b>.`);
  h+=`</div>`;

  const top=[...v].sort((a,b)=>b.a-a.a).slice(0,20);
  h+=`<h2 class="sect">${t('pTop')}</h2><div class="panel" style="margin-bottom:18px">
    <p class="pnote">${t('pTopN')}</p><div class="tw"><table class="tbl"><thead><tr><th>#</th>
    <th>${t('hDesc')}</th><th>${t('hSite')}</th><th>${t('hCat')}</th><th>${t('hVen')}</th>
    <th>${t('hDate')}</th><th class="num">${t('hAmt')}</th><th class="num">${t('hShare')}</th></tr></thead><tbody>`;
  top.forEach((r,i)=>{h+=`<tr><td class="mono" style="color:var(--mut)">${i+1}</td>
    <td style="max-width:230px">${esc(r.d)}</td><td style="font-size:11.5px">${esc(siteN(r.s))}</td>
    <td><span class="lg"><i style="background:${CATCOL[r.c]}"></i><span style="font-size:12px">${esc(catN(r.c))}</span></span></td>
    <td style="font-size:11.5px">${esc(venN(r.v))}</td>
    <td class="mono">${r.dt||`<span class="tag">${t('nodate')}</span>`}</td>
    <td class="num mono"><b>${money2(r.a)}</b></td><td class="num mono">${pct(r.a,tot)}</td></tr>`;});
  h+=`</tbody></table></div></div>`;

  const rep={};v.filter(r=>r.a>=100).forEach(r=>{const k=r.a.toFixed(2);(rep[k]=rep[k]||[]).push(r);});
  const reps=Object.values(rep).filter(a=>a.length>=3).sort((a,b)=>b[0].a*b.length-a[0].a*a.length).slice(0,12);
  if(reps.length){h+=`<h2 class="sect">${t('pRep')}</h2><div class="panel" style="margin-bottom:18px">
    <p class="pnote">${t('pRepN')}</p><div class="tw"><table class="tbl"><thead><tr>
    <th class="num">${t('hAmt')}</th><th class="num">${t('hTimes')}</th><th class="num">${t('hTotal')}</th>
    <th>${t('hVen')}</th><th>${t('hCat')}</th><th>${t('hDesc')}</th><th>${E?'Dates':'תאריכים'}</th></tr></thead><tbody>`;
  reps.forEach(a=>{const ds=[...new Set(a.map(r=>r.dt).filter(x=>x))];
    h+=`<tr><td class="num mono"><b>${money2(a[0].a)}</b></td>
      <td class="num mono">${a.length}${a.length>=6?' <span class="tag w">!</span>':''}</td>
      <td class="num mono">${money2(a[0].a*a.length)}</td>
      <td style="font-size:11.5px">${[...new Set(a.map(r=>venN(r.v)))].map(esc).join('<br>')}</td>
      <td style="font-size:11.5px">${[...new Set(a.map(r=>catN(r.c)))].map(esc).join('<br>')}</td>
      <td style="font-size:11.5px;max-width:190px">${[...new Set(a.map(r=>r.d))].map(esc).join('<br>')}</td>
      <td class="mono" style="font-size:11px">${ds.length?ds.slice(0,4).join('<br>')+(ds.length>4?` +${ds.length-4}`:''):`<span class="tag">${t('nodate')}</span>`}</td></tr>`;});
  h+=`</tbody></table></div></div>`;}

  if(cr.length){const cg=grp(cr,r=>r.s).sort((a,b)=>a.s-b.s);
  h+=`<h2 class="sect">${t('pCred')}</h2><div class="panel"><p class="pnote">${t('pCredN')}</p>
    <div class="tw"><table class="tbl"><thead><tr><th>${t('hSite')}</th><th class="num">${t('hCnt')}</th>
    <th class="num">${t('hTotal')}</th><th>${E?'Largest reversal':'ההיפוך הגדול'}</th></tr></thead><tbody>`;
  cg.forEach(x=>{const w=v.filter(r=>r.s===+x.k&&r.a<0).sort((a,b)=>a.a-b.a)[0];
    h+=`<tr><td><b>${esc(siteN(+x.k))}</b></td><td class="num mono">${x.n}</td>
      <td class="num mono negv">${money2(x.s)}</td>
      <td style="font-size:12px">${esc(w.d)} <span class="tag g">${money2(w.a)}</span></td></tr>`;});
  h+=`</tbody></table></div></div>`;}
  return h;
}

/* ============ DATA ============ */
let Q='',SORT='a',DIR=-1,PAGE=0;const PER=60;
function tabData(){
  let v=view();
  if(Q){const q=Q.toLowerCase();
    v=v.filter(r=>(r.d+' '+VENS[r.v].join(' ')+' '+CATS[r.c].join(' ')+' '+SITES[r.s].join(' ')+' '+CCS[r.cc].join(' ')+' '+r.a).toLowerCase().includes(q));}
  const key={a:r=>r.a,d:r=>r.dt||'0000',f:r=>siteN(r.s),c:r=>catN(r.c),v:r=>venN(r.v),x:r=>r.d};
  v=[...v].sort((p,q2)=>{const A=key[SORT](p),B=key[SORT](q2);return (A<B?-1:A>B?1:0)*DIR;});
  const pages=Math.max(1,Math.ceil(v.length/PER));if(PAGE>=pages)PAGE=0;
  const sl=v.slice(PAGE*PER,PAGE*PER+PER);
  const th=(k,lab,cls)=>`<th class="srt ${cls||''}" onclick="srt('${k}')">${lab}${SORT===k?(DIR<0?' ▾':' ▴'):''}</th>`;
  let h=`<div class="panel"><h3 class="ptitle">${t('pData')}</h3><p class="pnote">${t('pDataN')}</p>
    <div class="searchrow">
      <input type="search" id="q" placeholder="${t('search')}" value="${esc(Q)}" oninput="doSearch(this.value)">
      <span class="fstat">${nf.format(v.length)} ${t('of')} ${nf.format(D.length)} · <b>${money2(sum(v))}</b></span>
    </div><div class="tw"><table class="tbl"><thead><tr>
    ${th('d',t('hDate'))}${th('f',t('hSite'))}${th('c',t('hCat'))}${th('v',t('hVen'))}${th('x',t('hDesc'))}
    <th class="num">${t('hFy')}</th>${th('a',t('hAmt'),'num')}</tr></thead><tbody>`;
  if(!sl.length)h+=`<tr><td colspan="7" style="padding:26px;text-align:center;color:var(--mut)">${t('none')}</td></tr>`;
  sl.forEach(r=>{h+=`<tr>
    <td class="mono" style="white-space:nowrap">${r.dt||`<span class="tag">${t('nodate')}</span>`}</td>
    <td style="font-size:11.5px">${esc(siteN(r.s))}<div style="color:var(--mut);font-size:10.5px">${esc(ccN(r.cc))}</div></td>
    <td><span class="lg"><i style="background:${CATCOL[r.c]}"></i><span style="font-size:12px">${esc(catN(r.c))}</span></span></td>
    <td style="font-size:11.5px">${esc(venN(r.v))}</td>
    <td style="font-size:11.5px;max-width:250px">${esc(r.d)}${r.card?` <span class="tag">${L==='en'?'card':'אשראי'}</span>`:''}</td>
    <td class="num mono" style="color:var(--mut)">${r.fy||''}</td>
    <td class="num mono ${r.a<0?'negv':''}"><b>${money2(r.a)}</b></td></tr>`;});
  return h+`</tbody></table></div>
    <div class="pg"><button onclick="pg(-1)" ${PAGE===0?'disabled':''}>${L==='en'?'← Prev':'→ הקודם'}</button>
    <span>${PAGE+1} ${t('of')} ${pages}</span>
    <button onclick="pg(1)" ${PAGE>=pages-1?'disabled':''}>${L==='en'?'Next →':'הבא ←'}</button></div></div>`;
}
function doSearch(val){Q=val;PAGE=0;paint('tab-data',tabData());
  const el=document.getElementById('q');
  if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
function srt(k){if(SORT===k)DIR=-DIR;else{SORT=k;DIR=k==='a'?-1:1;}paint('tab-data',tabData());}
function pg(d){PAGE+=d;paint('tab-data',tabData());
  document.getElementById('tab-data').scrollIntoView({behavior:'smooth',block:'start'});}

/* ============ SOURCES & AUDIT ============ */
function tabSrc(){
  const E=L==='en';
  let h=`<div class="panel" style="margin-bottom:18px"><h3 class="ptitle">${t('pRec')}</h3>
    <p class="pnote">${t('pRecN')}</p><div class="tw"><table class="tbl"><thead><tr>
    <th>${t('hFile')}</th><th>${t('hScope')}</th><th class="num">${t('hRows')}</th>
    <th class="num">${t('hComputed')}</th><th class="num">${t('hDeclared')}</th><th class="num">${t('hDiff')}</th>
    </tr></thead><tbody>`;
  const FN={F1:'PMexpenses-2025_2026-cope(בלפור ותמך).csv',
            F2:'PMexpenses-2025_2026(עזה וקיסריה ).csv',
            F3:'PMexpenses-2025_2026-cope(עזה וקיסריה).csv'};
  let ct=0,dt2=0;
  SRCS.forEach((s,i)=>{const rr=D.filter(r=>r.src===i),c=sum(rr),dec=FOOTERS[s[0]];
    ct+=c;dt2+=dec;
    h+=`<tr><td class="mono" style="font-size:11px">${esc(FN[s[0]])}</td>
      <td>${esc(srcN(i))}</td><td class="num mono">${nf.format(rr.length)}</td>
      <td class="num mono">${money2(c)}</td><td class="num mono">${money2(dec)}</td>
      <td class="num mono ${Math.abs(c-dec)<1?'ok':''}">${Math.abs(c-dec)<0.005?'✓ 0.00':money2(c-dec)}</td></tr>`;});
  h+=`<tr style="border-top:2px solid var(--line2)"><td colspan="2"><b>${t('itemized')}</b></td>
    <td class="num mono"><b>${nf.format(D.length)}</b></td><td class="num mono"><b>${money2(ct)}</b></td>
    <td class="num mono"><b>${money2(dt2)}</b></td><td class="num mono ok"><b>${Math.abs(ct-dt2)<1?'✓':money2(ct-dt2)}</b></td></tr>`;
  PAYROLL.forEach(p=>{h+=`<tr><td class="mono" style="font-size:11px">${esc(FN[p.src])}</td>
    <td>${esc(E?p.le:p.lh)} <span class="tag r">${E?'no line detail':'ללא פירוט'}</span></td>
    <td class="num mono" style="color:var(--c3)">0</td><td class="num mono">—</td>
    <td class="num mono">${money2(p.amt)}</td><td class="num mono">—</td></tr>`;});
  h+=`<tr style="border-top:2px solid var(--line2)"><td colspan="4"><b>${t('kGrand')}</b></td>
    <td class="num mono"><b>${money2(GRAND)}</b></td><td></td></tr>`;
  h+=`</tbody></table></div></div>`;
  h+=`<div class="ins">
    ${card('a','⧉',t('pDup'),t('pDupN'))}
    ${card('','◆',t('pPay'),t('pPayN')+`<span class="big">${money(PAY)}</span>${pct(PAY,GRAND)} ${E?'of the grand total':'מהסך הכולל'}`)}
  </div>`;
  /* per-source composition */
  const rows=SRCS.map((s,i)=>{const rr=D.filter(r=>r.src===i&&r.a>0);
    const parts=grp(rr,r=>r.c).sort((a,b)=>b.s-a.s).map(p=>({l:catN(+p.k),v:p.s,n:p.n,c:CATCOL[+p.k],k:+p.k}));
    return{l:srcN(i),tot:parts.reduce((a,p)=>a+p.v,0),parts:parts};}).filter(r=>r.tot>0);
  h+=`<div class="panel"><h3 class="ptitle">${E?'What each extract contains':'מה יש בכל קובץ'}</h3>
    <p class="pnote">${E?'The three extracts cover different sites and different years, and they do not overlap — no line in one file matches a line in another on amount, description and date.'
      :'שלושת הקבצים מכסים מתקנים ושנים שונים, ואינם חופפים — אף שורה בקובץ אחד אינה תואמת שורה בקובץ אחר בסכום, בתיאור ובתאריך.'}</p>
    ${stack100(rows,640)}</div>`;
  return h;
}

function paint(id,html){const el=document.getElementById(id);el.innerHTML=html;wire(el);}
function renderAll(){renderControls();
  TABIDS.forEach((id,i)=>document.getElementById(id).className=i===TAB?'':'hide');
  paint(TABIDS[TAB],[tabOverview,tabSite,tabTrend,tabVend,tabIns,tabData,tabSrc][TAB]());}
renderAll();
</script>
